
name: CI-CD-Pipeline

on:
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "build the code"

  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build using Docker
        run: echo "building the docker"

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Running the test cases
        run: echo "testing the app"

  deploy:
    needs: [test,build]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on the machine
        run: echo "deploying the code"
